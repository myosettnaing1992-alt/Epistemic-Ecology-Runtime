name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Python setup
      # --------------------------------------------------------
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Show Python version
        run: python --version

      # --------------------------------------------------------
      # Debug: show repo structure
      # --------------------------------------------------------
      - name: Show repository structure
        run: |
          echo "=== Root ==="
          ls -la
          echo ""
          echo "=== eer/ ==="
          ls -la eer/ || true
          echo ""
          echo "=== tests/ ==="
          ls -la tests/ || true
          echo ""
          echo "=== benchmarks/ ==="
          ls -la benchmarks/ || true

      # --------------------------------------------------------
      # Install
      # --------------------------------------------------------
      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Install package (editable) with dev + bench extras
        run: pip install -e ".[dev,bench]"

      # --------------------------------------------------------
      # Verify imports (fail fast)
      # --------------------------------------------------------
      - name: Verify core imports
        run: |
          python -c "import eer; print('eer', eer.__version__)"
          python -c "from eer import EpistemicGraph; print('EpistemicGraph OK')"
          python -c "from eer import FastGridSearchCalibrator; print('FastGridSearchCalibrator OK')"
          python -c "from eer import build_cycle_matrix_fundamental; print('build_cycle_matrix_fundamental OK')"
          python -c "from eer.utils import make_ba_graph, make_er_graph, set_random_priors; print('utils OK')"
          python -c "from eer.schedulers import _residual_inf, _update_coord; print('schedulers OK')"

      # --------------------------------------------------------
      # Lint (non-blocking)
      # --------------------------------------------------------
      - name: Lint with ruff (non-blocking)
        run: ruff check eer/ benchmarks/ experiments/ || true
        continue-on-error: true

      - name: Format check with ruff (non-blocking)
        run: ruff format --check eer/ benchmarks/ experiments/ || true
        continue-on-error: true

      # --------------------------------------------------------
      # Type check (non-blocking)
      # --------------------------------------------------------
      - name: Type check with mypy (non-blocking)
        run: mypy eer/ || true
        continue-on-error: true

      # --------------------------------------------------------
      # Tests
      # --------------------------------------------------------
      - name: Run tests with coverage
        run: |
          pytest -v tests/ \
            --cov=eer \
            --cov-report=term-missing \
            --cov-report=xml
        timeout-minutes: 25

      # --------------------------------------------------------
      # Coverage upload (non-blocking)
      # --------------------------------------------------------
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

      # --------------------------------------------------------
      # Smoke benchmark (non-blocking)
      # --------------------------------------------------------
      - name: Smoke benchmark
        run: python benchmarks/run_benchmarks.py --smoke --quiet
        continue-on-error: true
        timeout-minutes: 5
