[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epistemic-ecology-runtime"
version = "0.1.0"
description = "A strictly convex variational framework for belief aggregation on directed epistemic graphs"
readme = "README.md"
requires-python = ">=3.11"

license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "Myo Sett Naing", email = "you@example.com" }
]

keywords = [
    "belief-aggregation",
    "convex-optimization",
    "graph-laplacian",
    "coordinate-descent",
    "numba",
    "scientific-computing",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "numba>=0.57.0",
    "networkx>=3.0",
    "joblib>=1.2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]
bench = [
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/myosettnaing/epistemic-ecology-runtime"
Repository = "https://github.com/myosettnaing/epistemic-ecology-runtime"
Issues = "https://github.com/myosettnaing/epistemic-ecology-runtime/issues"

[tool.setuptools.packages.find]
include = ["eer*"]
exclude = ["tests*", "benchmarks*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
source = ["eer"]
omit = ["tests/*", "benchmarks/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501"]
