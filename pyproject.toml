[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

# ============================================================
# Project metadata
# ============================================================

[project]
name = "epistemic-ecology-runtime"
version = "0.1.0"
description = "A strictly convex variational framework for belief aggregation on directed epistemic graphs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Myo Sett Naing", email = "your.email@institution.edu" },
]
maintainers = [
    { name = "Myo Sett Naing", email = "your.email@institution.edu" },
]
keywords = [
    "belief aggregation",
    "variational inference",
    "gauss-seidel",
    "epistemic graphs",
    "convex optimization",
    "numba",
    "scientific computing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
    "numpy>=1.24.0,<2.0",
    "scipy>=1.10.0,<2.0",
    "networkx>=3.0,<4.0",
    "numba>=0.57.0,<0.60",
    "joblib>=1.2.0,<2.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0,<9.0",
    "pytest-cov>=4.1.0,<6.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
]
bench = [
    "matplotlib>=3.7.0,<4.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
]

[project.urls]
Homepage = "https://github.com/myosettnaing1992-alt/Epistemic-Ecology-Runtime"
Repository = "https://github.com/myosettnaing1992-alt/Epistemic-Ecology-Runtime"
Issues = "https://github.com/myosettnaing1992-alt/Epistemic-Ecology-Runtime/issues"
Changelog = "https://github.com/myosettnaing1992-alt/Epistemic-Ecology-Runtime/blob/main/CHANGELOG.md"
Citation = "https://github.com/myosettnaing1992-alt/Epistemic-Ecology-Runtime/blob/main/CITATION.cff"

[project.scripts]
eer-benchmark = "benchmarks.run_benchmarks:main"
eer-format = "benchmarks.format_benchmark:main"

# ============================================================
# Setuptools — package discovery
# ============================================================

[tool.setuptools.packages.find]
where = ["."]
include = ["eer*"]
exclude = [
    "tests*",
    "benchmarks*",
    "experiments*",
    "docs*",
    "results*",
    "figures*",
    "data*",
    "build*",
    "dist*",
]

# ============================================================
# Pytest
# ============================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: mark test as slow (deselect with '-m \"not slow\"')",
    "integration: mark test as integration (multi-module)",
]

# ============================================================
# Coverage
# ============================================================

[tool.coverage.run]
source = ["eer"]
omit = [
    "*/tests/*",
    "*/benchmarks/*",
    "*/experiments/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

# ============================================================
# Ruff — linter & formatter
# Note: "N" (pep8-naming) is intentionally NOT selected, because
# scientific code conventionally uses uppercase for matrices (H, Q, A)
# and graphs (G). PEP 8 naming rules conflict with domain convention.
# ============================================================

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "venv",
    "build",
    "dist",
    "__pycache__",
    "results",
    "figures",
    "data",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function call in default argument
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "E402"]
"benchmarks/*" = ["E402"]
"experiments/*" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ============================================================
# mypy — type checker
# ============================================================

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_any_unimported = false
ignore_missing_imports = true
exclude = [
    "build/",
    "dist/",
    "tests/",
    "benchmarks/",
    "experiments/",
]
